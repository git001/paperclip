apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperclip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the OpenShift router (Route → Service → Pod)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - port: 3100
          protocol: TCP
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS (Azure Key Vault, MCG/NooBaa S3, npm registry, AI APIs,
    # Azure Blob Storage) and Azure PostgreSQL (5432, TLS). Tighten per overlay
    # if egress firewall rules are required.
    - ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
