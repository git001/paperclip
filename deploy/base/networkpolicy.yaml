apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperclip
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the OpenShift router (Route → Service → Pod)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - port: 3100
          protocol: TCP
  egress:
    # NetworkPolicy matches the destination POD port, not the Service port.
    # Allow DNS resolution: the dns-default Service listens on 53, the
    # OpenShift DNS pods on 5353.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Port-restricted only, destinations are not limited. Add to: rules or an
    # egress firewall per overlay if destination filtering is required.
    # - 443:  external HTTPS without proxy (AI APIs, npm); Key Vault is queried by the ESO controller, not this pod
    # - 6443: MCG/NooBaa S3 pods (the s3 Service maps 443 -> 6443)
    # - 5432: Azure PostgreSQL (TLS)
    # With a corporate proxy, also allow the proxy port (often 3128 or 8080).
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 5432
          protocol: TCP
